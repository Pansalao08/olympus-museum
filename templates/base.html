<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OLYMPUS | Cyberpunk Sports Museum{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* MODO OSCURO CYBERPUNK NEÓN (POR DEFECTO) */
        :root {
            --bg-dark: #05050a;
            --bg-card: #0d0f18;
            --accent-neon-cyan: #00f2fe;
            --accent-neon-magenta: #ff0055;
            --accent-neon-yellow: #ffea00;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --card-border: rgba(0, 242, 254, 0.2);
            --nav-bg: rgba(5, 5, 10, 0.95);
        }

        /* MODO CLARO CORREGIDO (LETRAS OSCURAS LEGIBLES) */
        [data-theme="light"] {
            --bg-dark: #f0f4f8;
            --bg-card: #ffffff;
            --accent-neon-cyan: #0077b6;
            --accent-neon-magenta: #d90429;
            --accent-neon-yellow: #ffb703;
            --text-main: #111827;       /* ¡Letras oscuras perfectas para modo claro! */
            --text-muted: #4b5563;       /* ¡Gris oscuro legible! */
            --card-border: rgba(0, 0, 0, 0.15);
            --nav-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a, a:visited, a:hover, a:active {
            color: inherit;
            text-decoration: none;
        }

        header.museum-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-neon-cyan);
            text-shadow: 0 0 10px var(--accent-neon-cyan);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--accent-neon-magenta);
        }

        .theme-toggle-btn {
            background: transparent;
            border: 2px solid var(--accent-neon-cyan);
            color: var(--accent-neon-cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .theme-toggle-btn:hover {
            background: var(--accent-neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--accent-neon-cyan);
        }

        footer {
            text-align: center;
            padding: 3rem 5%;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body data-theme="dark">
    <header class="museum-navbar">
        <a href="/" class="nav-logo">⚡ OLYMPUS CYBERMUSEUM</a>
        <div class="nav-controls">
            <ul class="nav-links">
                <li><a href="/#invierno">Invierno</a></li>
                <li><a href="/#verano">Verano</a></li>
            </ul>
            <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ / 🌙 MODO</button>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 OLYMPUS CYBERMUSEUM &mdash; Proyecto Escolar de Programación Avanzada.</p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
